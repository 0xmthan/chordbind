# Builds pull requests. Pushes to main are handled by release.yml.
name: build
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew && ./gradlew build collectJars
      - uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/*/*.jar
