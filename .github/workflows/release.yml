# On every push to main: build every Minecraft version, upload to Modrinth and publish a
# GitHub release. If stonecutter.properties.toml still has a version that was already
# released (its v<version> tag exists), the patch number is bumped and committed back first.
# Modrinth goes first so a failed upload leaves nothing pushed and the run can be retried.
name: release
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/**'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6

      - name: Determine version
        id: version
        run: |
          current=$(sed -nE 's/^mod\.version = "(.+)"$/\1/p' stonecutter.properties.toml)
          if git rev-parse -q --verify "refs/tags/v$current" >/dev/null; then
            IFS=. read -r major minor patch <<< "$current"
            next="$major.$minor.$((patch + 1))"
            sed -i -E "s/^mod\.version = \".+\"$/mod.version = \"$next\"/" stonecutter.properties.toml
            echo "v$current already released, bumping to $next"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            next="$current"
            echo "Releasing v$next as set in stonecutter.properties.toml"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Build
        run: chmod +x ./gradlew && ./gradlew build collectJars

      - name: Write changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          previous=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            git log --no-merges --format='- %s' ${previous:+"$previous"..}HEAD | grep -v '\[skip ci\]' || true
            if [ -n "$previous" ]; then
              echo
              echo "**Full changelog:** https://github.com/$REPO/compare/$previous...v$VERSION"
            fi
          } > "$RUNNER_TEMP/changelog.md"
          cat "$RUNNER_TEMP/changelog.md"

      - name: Upload to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          export CHANGELOG="$(cat "$RUNNER_TEMP/changelog.md")"
          ./gradlew publishMods

      - name: Commit version bump
        if: steps.version.outputs.bumped == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump version to $VERSION [skip ci]"
          git push origin HEAD:main

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$(git rev-parse HEAD)" \
            --title "ChordBind $VERSION" \
            --notes-file "$RUNNER_TEMP/changelog.md" \
            build/libs/"$VERSION"/*.jar
