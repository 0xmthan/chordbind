# On every push to main: build and publish a GitHub release.
# If gradle.properties still has a version that was already released (its v<version>
# tag exists), the patch number is bumped and committed back to main first.
name: release
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/**'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6

      - name: Determine version
        id: version
        run: |
          current=$(grep -E '^version=' gradle.properties | cut -d= -f2)
          if git rev-parse -q --verify "refs/tags/v$current" >/dev/null; then
            IFS=. read -r major minor patch <<< "$current"
            next="$major.$minor.$((patch + 1))"
            sed -i "s/^version=.*/version=$next/" gradle.properties
            echo "v$current already released, bumping to $next"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            next="$current"
            echo "Releasing v$next as set in gradle.properties"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Build
        run: chmod +x ./gradlew && ./gradlew build

      - name: Commit version bump
        if: steps.version.outputs.bumped == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump version to $VERSION [skip ci]"
          git push origin HEAD:main

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$(git rev-parse HEAD)" \
            --title "ChordBind $VERSION" \
            --generate-notes \
            "build/libs/chordbind-$VERSION.jar"
